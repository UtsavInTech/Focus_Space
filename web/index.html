<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <script src="/appearance-init.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      The FocusSpace mark. "?v=2" because the icon's address never changed when the mark did, and browsers
      keep a favicon cached by address — without a new one, returning visitors kept seeing the old logo.
      Bump it whenever the mark changes again.
    -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png?v=2" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/icon-16.png?v=2" />
    <link rel="apple-touch-icon" href="/icons/icon-128.png?v=2" />
    <title>FocusSpace: YouTube, organised around what you came for</title>
    <meta
      name="description"
      content="Tell FocusSpace what you're learning. It ranks your subscriptions around it, hides the attention traps, follows the course you're on, and turns what you watched into notes and mind maps."
    />
    <meta property="og:title" content="FocusSpace: YouTube, organised around what you came for" />
    <meta
      property="og:description"
      content="A Chrome extension that turns YouTube into a course: ranked subscriptions, no Shorts, a learning path, and notes and mind maps from what you actually watched."
    />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#0f0d0d" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
